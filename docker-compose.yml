services:
  db:
    image: mysql:8.4
    container_name: jsp_ecom_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jsp-servlet-ecommerce-website
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./Dump20210903.sql:/docker-entrypoint-initdb.d/Dump20210903.sql:ro
      - ./docker/mysql/init/02-import.sh:/docker-entrypoint-initdb.d/02-import.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build: .
    container_name: jsp_ecom_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/jsp-servlet-ecommerce-website?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASS: root
    ports:
      - "8080:8080"

volumes:
  db_data:
